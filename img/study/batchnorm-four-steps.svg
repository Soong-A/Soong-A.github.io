<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 620" role="img" aria-labelledby="title desc">
  <style>text{paint-order:stroke;stroke:#FFFEFA;stroke-width:1.8px;stroke-linejoin:round;stroke-opacity:.84}</style>
  <title id="title">BatchNorm 四步手算</title>
  <desc id="desc">从输入1、3、5、7开始，先求均值4，再求方差5，然后得到均值为0方差为1的标准化值，最后通过gamma和beta进行可学习的缩放平移。</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#756F67" stroke-opacity=".07"/></pattern>
    <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#51493F" flood-opacity=".13"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#8B837A"/></marker>
  </defs>
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" fill="#51493F">
    <text x="590" y="54" text-anchor="middle" font-size="28" font-weight="700">BatchNorm 不是魔法：四步就能手算</text>
    <text x="590" y="84" text-anchor="middle" font-size="15" fill="#756F67">例子 x = [1, 3, 5, 7]</text>
    <g transform="translate(45 125)" filter="url(#shadow)">
      <rect width="245" height="375" rx="20" fill="#FFFEFC" stroke="#D8D0C4" stroke-width="1.5"/>
      <circle cx="42" cy="42" r="22" fill="#75629C"/><text x="42" y="50" text-anchor="middle" font-size="20" font-weight="700" fill="white">1</text>
      <text x="126" y="48" text-anchor="middle" font-size="21" font-weight="700">求均值</text>
      <g font-size="20" text-anchor="middle"><rect x="35" y="90" width="175" height="55" rx="12" fill="#F1EBF8"/><text x="122" y="125">1 + 3 + 5 + 7</text><line x1="55" y1="137" x2="190" y2="137" stroke="#75629C"/><text x="122" y="171">4</text></g>
      <text x="122" y="225" text-anchor="middle" font-size="18">数据中心</text>
      <text x="122" y="277" text-anchor="middle" font-size="28" font-weight="700" fill="#5F4F85">mu = 4</text>
      <text x="122" y="324" text-anchor="middle" font-size="15" fill="#756F67">先找这一组数</text><text x="122" y="347" text-anchor="middle" font-size="15" fill="#756F67">大致位于哪里</text>
    </g>
    <path d="M298 312H330" stroke="#8B837A" stroke-width="2" marker-end="url(#arr)"/>
    <g transform="translate(340 125)" filter="url(#shadow)">
      <rect width="245" height="375" rx="20" fill="#FFFEFC" stroke="#D8D0C4" stroke-width="1.5"/>
      <circle cx="42" cy="42" r="22" fill="#B68B2D"/><text x="42" y="50" text-anchor="middle" font-size="20" font-weight="700" fill="white">2</text>
      <text x="126" y="48" text-anchor="middle" font-size="21" font-weight="700">求方差</text>
      <text x="122" y="112" text-anchor="middle" font-size="16">离均值的距离平方</text>
      <text x="122" y="151" text-anchor="middle" font-size="18">9, 1, 1, 9</text>
      <rect x="36" y="183" width="173" height="72" rx="12" fill="#F6E8C0"/>
      <text x="122" y="214" text-anchor="middle" font-size="19">(9+1+1+9) / 4</text>
      <text x="122" y="288" text-anchor="middle" font-size="28" font-weight="700" fill="#8F6A21">var = 5</text>
      <text x="122" y="329" text-anchor="middle" font-size="15" fill="#756F67">衡量这组数</text><text x="122" y="352" text-anchor="middle" font-size="15" fill="#756F67">分散得有多开</text>
    </g>
    <path d="M593 312H625" stroke="#8B837A" stroke-width="2" marker-end="url(#arr)"/>
    <g transform="translate(635 125)" filter="url(#shadow)">
      <rect width="245" height="375" rx="20" fill="#FFFEFC" stroke="#D8D0C4" stroke-width="1.5"/>
      <circle cx="42" cy="42" r="22" fill="#3B9E88"/><text x="42" y="50" text-anchor="middle" font-size="20" font-weight="700" fill="white">3</text>
      <text x="126" y="48" text-anchor="middle" font-size="21" font-weight="700">标准化</text>
      <rect x="28" y="84" width="189" height="58" rx="12" fill="#EAF4F0"/>
      <text x="122" y="120" text-anchor="middle" font-size="18">(x - 4) / sqrt(5)</text>
      <g font-size="18" text-anchor="middle" fill="#277F6E"><text x="122" y="186">-1.342</text><text x="122" y="220">-0.447</text><text x="122" y="254">0.447</text><text x="122" y="288">1.342</text></g>
      <text x="122" y="333" text-anchor="middle" font-size="16" font-weight="700">均值约 0 · 方差约 1</text>
      <text x="122" y="357" text-anchor="middle" font-size="14" fill="#756F67">eps 在此省略</text>
    </g>
    <path d="M888 312H920" stroke="#8B837A" stroke-width="2" marker-end="url(#arr)"/>
    <g transform="translate(930 125)" filter="url(#shadow)">
      <rect width="205" height="375" rx="20" fill="#FFFEFC" stroke="#D8D0C4" stroke-width="1.5"/>
      <circle cx="42" cy="42" r="22" fill="#C14E69"/><text x="42" y="50" text-anchor="middle" font-size="20" font-weight="700" fill="white">4</text>
      <text x="119" y="48" text-anchor="middle" font-size="20" font-weight="700">缩放平移</text>
      <rect x="22" y="90" width="161" height="78" rx="12" fill="#F8E7EB"/>
      <text x="102" y="122" text-anchor="middle" font-size="18">y = gamma*x_hat</text><text x="102" y="149" text-anchor="middle" font-size="18">+ beta</text>
      <text x="102" y="218" text-anchor="middle" font-size="17">gamma：拉伸/压缩</text>
      <text x="102" y="255" text-anchor="middle" font-size="17">beta：左右移动</text>
      <text x="102" y="310" text-anchor="middle" font-size="17" font-weight="700" fill="#B45269">两者都由训练学习</text>
      <text x="102" y="348" text-anchor="middle" font-size="14" fill="#756F67">每个通道各一组</text>
    </g>
    <rect x="285" y="539" width="610" height="48" rx="14" fill="#FBF2D7" stroke="#B68B2D" stroke-width="1.4"/>
    <text x="590" y="570" text-anchor="middle" font-size="18" font-weight="700" fill="#8F6A21">前 3 步稳定尺度，第 4 步把表达自由还给网络</text>
  </g>
</svg>
