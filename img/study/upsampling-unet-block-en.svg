<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 560" role="img" aria-labelledby="title desc">
  <style>text{paint-order:stroke;stroke:#FFFEFA;stroke-width:1.8px;stroke-linejoin:round;stroke-opacity:.84}</style>
  <title id="title">U-Net Decoder Block: Data Flow and Shapes</title>
  <desc id="desc">Deep 256-channel 32 by 32 features are upsampled to 128 channels at 64 by 64, concatenated with the encoder's 128-channel 64 by 64 skip features, and fused by convolution into 128 channels at 64 by 64.</desc>
  <defs>
    <pattern id="gridbg" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#756F67" stroke-opacity=".07"/></pattern>
    <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#51493F" flood-opacity=".13"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#8B837A"/></marker>
    <marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#B68B2D"/></marker>
  </defs>
  <g font-family="'Segoe UI','Arial',sans-serif" fill="#51493F">
    <text x="580" y="54" text-anchor="middle" font-size="28" font-weight="700">U-Net Decoder: Upsample First, Then Fuse Features</text>
    <g filter="url(#shadow)">
      <rect x="45" y="213" width="185" height="100" rx="17" fill="#E9DEF3" stroke="#75629C" stroke-width="2"/>
      <rect x="294" y="213" width="185" height="100" rx="17" fill="#F6E8C0" stroke="#B68B2D" stroke-width="2"/>
      <rect x="570" y="213" width="185" height="100" rx="17" fill="#EAF4F0" stroke="#3B9E88" stroke-width="2"/>
      <rect x="850" y="213" width="210" height="100" rx="17" fill="#E1F2EC" stroke="#3B9E88" stroke-width="2"/>
      <rect x="570" y="75" width="185" height="86" rx="17" fill="#FBF2D7" stroke="#B68B2D" stroke-width="2"/>
    </g>
    <text x="137" y="251" text-anchor="middle" font-size="19" font-weight="700" fill="#5F4F85">Deep features</text><text x="137" y="282" text-anchor="middle" font-size="17">256 × 32 × 32</text>
    <path d="M232 263H281" stroke="#8B837A" stroke-width="2.5" marker-end="url(#arr)"/>
    <text x="386" y="247" text-anchor="middle" font-size="19" font-weight="700" fill="#8F6A21">Upsample ×2</text><text x="386" y="278" text-anchor="middle" font-size="17">128 × 64 × 64</text>
    <path d="M481 263H557" stroke="#8B837A" stroke-width="2.5" marker-end="url(#arr)"/>
    <text x="662" y="247" text-anchor="middle" font-size="19" font-weight="700" fill="#277F6E">Channel concat</text><text x="662" y="278" text-anchor="middle" font-size="17">256 × 64 × 64</text>
    <path d="M757 263H837" stroke="#8B837A" stroke-width="2.5" marker-end="url(#arr)"/>
    <text x="955" y="247" text-anchor="middle" font-size="19" font-weight="700" fill="#277F6E">Convolutional fusion</text><text x="955" y="278" text-anchor="middle" font-size="17">128 × 64 × 64</text>
    <text x="662" y="107" text-anchor="middle" font-size="18" font-weight="700" fill="#8F6A21">Encoder skip</text><text x="662" y="136" text-anchor="middle" font-size="16">128 × 64 × 64</text>
    <path d="M662 163V200" stroke="#B68B2D" stroke-width="3" marker-end="url(#gold)"/>
    <text x="757" y="183" font-size="15" fill="#8F6A21">Restore high-resolution detail</text>
    <g transform="translate(55 378)">
      <rect width="1050" height="120" rx="19" fill="#FFFEFC" stroke="#D8D0C4"/>
      <text x="525" y="34" text-anchor="middle" font-size="18" font-weight="700">Shape checklist</text>
      <text x="180" y="72" text-anchor="middle" font-size="17" fill="#5F4F85">Before concat: H and W must match</text>
      <text x="525" y="72" text-anchor="middle" font-size="17" fill="#8F6A21">After concat: C = C_up + C_skip</text>
      <text x="870" y="72" text-anchor="middle" font-size="17" fill="#277F6E">After fusion: convolution sets output C</text>
      <text x="525" y="101" text-anchor="middle" font-size="14" fill="#756F67">For odd sizes, explicitly match skip.shape[-2:]</text>
    </g>
  </g>
</svg>
