<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d">
  <title id="t">MM-UNet 完整架构图 / MM-UNet architecture</title>
  <desc id="d">3D 前列腺 MR 体数据进入 3D Res2Net 编码器逐级下采样；最深层经过 GCM（Mamba）注入全局上下文；解码器每一级由 AFFM 融合上采样的高层特征与编码器低层特征，再由 MACM 做多尺度各向异性卷积，最后输出分割掩膜。</desc>
  <rect width="900" height="520" rx="16" fill="#FBF7EF"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6B6B6B"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B8912B"/></marker>
  </defs>
  <g font-family="sans-serif" font-size="13" text-anchor="middle" fill="#2B2B2B">
    <text x="130" y="36" font-weight="700">编码器 · 3D Res2Net</text>
    <text x="770" y="36" font-weight="700">解码器 · AFFM + MACM</text>
    <!-- input/output -->
    <rect x="20" y="52" width="100" height="40" rx="8" fill="#FFFFFF" stroke="#8A8A8A"/><text x="70" y="77">3D MR 输入</text>
    <rect x="780" y="52" width="100" height="40" rx="8" fill="#FFFFFF" stroke="#8A8A8A"/><text x="830" y="77">分割掩膜</text>
    <!-- encoder stages -->
    <rect x="40"  y="120" width="150" height="44" rx="8" fill="#C9B8EA" stroke="#6D5AA6"/><text x="115" y="147">Res2Net 阶段 1</text>
    <rect x="70"  y="200" width="150" height="44" rx="8" fill="#C9B8EA" stroke="#6D5AA6"/><text x="145" y="227">Res2Net 阶段 2</text>
    <rect x="100" y="280" width="150" height="44" rx="8" fill="#C9B8EA" stroke="#6D5AA6"/><text x="175" y="307">Res2Net 阶段 3</text>
    <rect x="130" y="360" width="150" height="44" rx="8" fill="#C9B8EA" stroke="#6D5AA6"/><text x="205" y="387">Res2Net 阶段 4</text>
    <!-- GCM -->
    <rect x="360" y="440" width="180" height="50" rx="10" fill="#E8C766" stroke="#9A7A12"/><text x="450" y="462" font-weight="700">GCM · Mamba</text><text x="450" y="480" font-size="11">瓶颈处注入全局上下文</text>
    <!-- decoder stages: AFFM + MACM -->
    <rect x="620" y="360" width="150" height="44" rx="8" fill="#9CCBB5" stroke="#3F8068"/><text x="695" y="378">AFFM → MACM</text><text x="695" y="395" font-size="11">解码阶段 4</text>
    <rect x="650" y="280" width="150" height="44" rx="8" fill="#9CCBB5" stroke="#3F8068"/><text x="725" y="298">AFFM → MACM</text><text x="725" y="315" font-size="11">解码阶段 3</text>
    <rect x="680" y="200" width="150" height="44" rx="8" fill="#9CCBB5" stroke="#3F8068"/><text x="755" y="218">AFFM → MACM</text><text x="755" y="235" font-size="11">解码阶段 2</text>
    <rect x="710" y="120" width="150" height="44" rx="8" fill="#9CCBB5" stroke="#3F8068"/><text x="785" y="138">AFFM → MACM</text><text x="785" y="155" font-size="11">解码阶段 1</text>
  </g>
  <g stroke="#6B6B6B" stroke-width="1.8" fill="none" marker-end="url(#ah)">
    <path d="M70 92 L90 120"/>
    <path d="M115 164 L130 200"/><path d="M145 244 L160 280"/><path d="M175 324 L190 360"/>
    <path d="M280 395 L400 440"/><path d="M540 465 L650 404"/>
    <path d="M695 360 L715 324"/><path d="M725 280 L745 244"/><path d="M755 200 L775 164"/><path d="M810 120 L825 92"/>
  </g>
  <!-- skips -->
  <g stroke="#B8912B" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#ag)">
    <path d="M190 142 L710 142"/><path d="M220 222 L680 222"/><path d="M250 302 L650 302"/><path d="M280 382 L620 382"/>
  </g>
  <g font-family="sans-serif" font-size="12" fill="#7A5F10" text-anchor="middle">
    <text x="450" y="135">跳跃连接：低层细节送入 AFFM</text>
  </g>
  <!-- legend -->
  <g font-family="sans-serif" font-size="11" fill="#5A5A5A">
    <rect x="20" y="470" width="14" height="14" rx="3" fill="#C9B8EA" stroke="#6D5AA6"/><text x="40" y="481">编码</text>
    <rect x="80" y="470" width="14" height="14" rx="3" fill="#E8C766" stroke="#9A7A12"/><text x="100" y="481">全局上下文</text>
    <rect x="180" y="470" width="14" height="14" rx="3" fill="#9CCBB5" stroke="#3F8068"/><text x="200" y="481">融合与解码</text>
    <path d="M280 477 L310 477" stroke="#B8912B" stroke-width="2" stroke-dasharray="6 4"/><text x="316" y="481">跳跃连接</text>
  </g>
</svg>
