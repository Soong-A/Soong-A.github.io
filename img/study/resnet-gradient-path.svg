<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
  <style>text{paint-order:stroke;stroke:#FFFEFA;stroke-width:1.8px;stroke-linejoin:round;stroke-opacity:.84}</style>
  <title id="title">残差连接中的前向信息路径和反向梯度路径</title>
  <desc id="desc">输入既能经过复杂主分支，也能沿恒等捷径直接到加法节点。反向传播时梯度也有一条不经过主分支复杂变换的直接路径。</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#756F67" stroke-opacity=".07"/></pattern>
    <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#51493F" flood-opacity=".13"/></filter>
    <marker id="right" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#3B9E88"/></marker>
    <marker id="left" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#75629C"/></marker>
  </defs>
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" fill="#51493F">
    <text x="550" y="53" text-anchor="middle" font-size="27" font-weight="700">一条捷径，服务两个方向</text>
    <g filter="url(#shadow)">
      <circle cx="105" cy="245" r="40" fill="#FFFEFC" stroke="#8B837A" stroke-width="2"/>
      <rect x="265" y="120" width="500" height="145" rx="20" fill="#F1EBF8" stroke="#75629C" stroke-width="2"/>
      <circle cx="880" cy="245" r="38" fill="#F6E8C0" stroke="#B68B2D" stroke-width="2.4"/>
      <circle cx="1010" cy="245" r="40" fill="#FFFEFC" stroke="#8B837A" stroke-width="2"/>
    </g>
    <text x="105" y="253" text-anchor="middle" font-size="25" font-style="italic">x</text>
    <text x="515" y="174" text-anchor="middle" font-size="21" font-weight="700" fill="#5F4F85">复杂主分支 F(x)</text>
    <text x="515" y="211" text-anchor="middle" font-size="17">Conv → BN → ReLU → Conv → BN</text>
    <text x="515" y="239" text-anchor="middle" font-size="15" fill="#756F67">负责学习“需要改变什么”</text>
    <path d="M145 225C190 175 215 170 262 170" fill="none" stroke="#3B9E88" stroke-width="4" marker-end="url(#right)"/>
    <path d="M765 170C820 170 840 188 865 216" fill="none" stroke="#3B9E88" stroke-width="4" marker-end="url(#right)"/>
    <path d="M918 245H967" stroke="#3B9E88" stroke-width="4" marker-end="url(#right)"/>
    <path d="M145 265C225 343 695 353 860 269" fill="none" stroke="#B68B2D" stroke-width="5" stroke-dasharray="12 8" marker-end="url(#right)"/>
    <text x="503" y="371" text-anchor="middle" font-size="19" font-weight="700" fill="#8F6A21">前向：原始信息可以直接到达后面</text>
    <path d="M968 224H920" stroke="#75629C" stroke-width="3" marker-end="url(#left)"/>
    <path d="M860 286C696 419 224 410 145 285" fill="none" stroke="#75629C" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#left)"/>
    <text x="518" y="447" text-anchor="middle" font-size="19" font-weight="700" fill="#5F4F85">反向：梯度也有不经过复杂主分支的直接路径</text>
    <path d="M868 245H892M880 233V257" stroke="#8F6A21" stroke-width="3.2" stroke-linecap="round"/>
    <text x="1010" y="253" text-anchor="middle" font-size="25" font-style="italic">y</text>
    <text x="880" y="191" text-anchor="middle" font-size="16" font-weight="700" fill="#8F6A21">相加</text>
  </g>
</svg>
