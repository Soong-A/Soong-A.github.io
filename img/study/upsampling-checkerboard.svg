<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <style>text{paint-order:stroke;stroke:#FFFEFA;stroke-width:1.8px;stroke-linejoin:round;stroke-opacity:.84}</style>
  <title id="title">转置卷积覆盖不均与棋盘格</title>
  <desc id="desc">左侧kernel3 stride2时二维中心区域覆盖次数在1、2、4之间周期变化，形成棋盘式深浅。右侧kernel2 stride2时每个输出位置覆盖一次，结构上更均匀。</desc>
  <defs>
    <pattern id="gridbg" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#756F67" stroke-opacity=".07"/></pattern>
    <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#51493F" flood-opacity=".13"/></filter>
  </defs>
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" fill="#51493F">
    <text x="560" y="54" text-anchor="middle" font-size="28" font-weight="700">棋盘格的根源：不同位置被“撒到”不同次数</text>
    <g transform="translate(65 105)" filter="url(#shadow)">
      <rect width="465" height="445" rx="22" fill="#FFFEFC" stroke="#C14E69" stroke-width="1.8"/>
      <text x="232" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#B45269">kernel=3, stride=2</text>
      <text x="232" y="70" text-anchor="middle" font-size="15" fill="#756F67">内部覆盖次数不均匀</text>
      <g transform="translate(82 103)" font-size="19" font-weight="700" text-anchor="middle">
        <rect width="58" height="58" fill="#F8E7EB" stroke="#C14E69"/><text x="29" y="36">1</text><rect x="60" width="58" height="58" fill="#F1CCD5" stroke="#C14E69"/><text x="89" y="36">2</text><rect x="120" width="58" height="58" fill="#F8E7EB" stroke="#C14E69"/><text x="149" y="36">1</text><rect x="180" width="58" height="58" fill="#F1CCD5" stroke="#C14E69"/><text x="209" y="36">2</text><rect x="240" width="58" height="58" fill="#F8E7EB" stroke="#C14E69"/><text x="269" y="36">1</text>
        <rect y="60" width="58" height="58" fill="#F1CCD5" stroke="#C14E69"/><text x="29" y="96">2</text><rect x="60" y="60" width="58" height="58" fill="#C86A81" stroke="#B45269"/><text x="89" y="96" fill="white">4</text><rect x="120" y="60" width="58" height="58" fill="#F1CCD5" stroke="#C14E69"/><text x="149" y="96">2</text><rect x="180" y="60" width="58" height="58" fill="#C86A81" stroke="#B45269"/><text x="209" y="96" fill="white">4</text><rect x="240" y="60" width="58" height="58" fill="#F1CCD5" stroke="#C14E69"/><text x="269" y="96">2</text>
        <rect y="120" width="58" height="58" fill="#F8E7EB" stroke="#C14E69"/><text x="29" y="156">1</text><rect x="60" y="120" width="58" height="58" fill="#F1CCD5" stroke="#C14E69"/><text x="89" y="156">2</text><rect x="120" y="120" width="58" height="58" fill="#F8E7EB" stroke="#C14E69"/><text x="149" y="156">1</text><rect x="180" y="120" width="58" height="58" fill="#F1CCD5" stroke="#C14E69"/><text x="209" y="156">2</text><rect x="240" y="120" width="58" height="58" fill="#F8E7EB" stroke="#C14E69"/><text x="269" y="156">1</text>
        <rect y="180" width="58" height="58" fill="#F1CCD5" stroke="#C14E69"/><text x="29" y="216">2</text><rect x="60" y="180" width="58" height="58" fill="#C86A81" stroke="#B45269"/><text x="89" y="216" fill="white">4</text><rect x="120" y="180" width="58" height="58" fill="#F1CCD5" stroke="#C14E69"/><text x="149" y="216">2</text><rect x="180" y="180" width="58" height="58" fill="#C86A81" stroke="#B45269"/><text x="209" y="216" fill="white">4</text><rect x="240" y="180" width="58" height="58" fill="#F1CCD5" stroke="#C14E69"/><text x="269" y="216">2</text>
        <rect y="240" width="58" height="58" fill="#F8E7EB" stroke="#C14E69"/><text x="29" y="276">1</text><rect x="60" y="240" width="58" height="58" fill="#F1CCD5" stroke="#C14E69"/><text x="89" y="276">2</text><rect x="120" y="240" width="58" height="58" fill="#F8E7EB" stroke="#C14E69"/><text x="149" y="276">1</text><rect x="180" y="240" width="58" height="58" fill="#F1CCD5" stroke="#C14E69"/><text x="209" y="276">2</text><rect x="240" y="240" width="58" height="58" fill="#F8E7EB" stroke="#C14E69"/><text x="269" y="276">1</text>
      </g>
      <text x="232" y="427" text-anchor="middle" font-size="17" font-weight="700" fill="#B45269">1 / 2 / 4 次交替 → 周期明暗</text>
    </g>
    <g transform="translate(590 105)" filter="url(#shadow)">
      <rect width="465" height="445" rx="22" fill="#FFFEFC" stroke="#3B9E88" stroke-width="1.8"/>
      <text x="232" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#277F6E">kernel=2, stride=2</text>
      <text x="232" y="70" text-anchor="middle" font-size="15" fill="#756F67">核大小可被步幅整除</text>
      <g transform="translate(82 103)" font-size="19" font-weight="700" text-anchor="middle">
        <g fill="#E1F2EC" stroke="#3B9E88">
          <rect width="58" height="58"/><rect x="60" width="58" height="58"/><rect x="120" width="58" height="58"/><rect x="180" width="58" height="58"/><rect x="240" width="58" height="58"/>
          <rect y="60" width="58" height="58"/><rect x="60" y="60" width="58" height="58"/><rect x="120" y="60" width="58" height="58"/><rect x="180" y="60" width="58" height="58"/><rect x="240" y="60" width="58" height="58"/>
          <rect y="120" width="58" height="58"/><rect x="60" y="120" width="58" height="58"/><rect x="120" y="120" width="58" height="58"/><rect x="180" y="120" width="58" height="58"/><rect x="240" y="120" width="58" height="58"/>
          <rect y="180" width="58" height="58"/><rect x="60" y="180" width="58" height="58"/><rect x="120" y="180" width="58" height="58"/><rect x="180" y="180" width="58" height="58"/><rect x="240" y="180" width="58" height="58"/>
          <rect y="240" width="58" height="58"/><rect x="60" y="240" width="58" height="58"/><rect x="120" y="240" width="58" height="58"/><rect x="180" y="240" width="58" height="58"/><rect x="240" y="240" width="58" height="58"/>
        </g>
        <g fill="#277F6E"><text x="29" y="36">1</text><text x="89" y="36">1</text><text x="149" y="36">1</text><text x="209" y="36">1</text><text x="269" y="36">1</text><text x="29" y="96">1</text><text x="89" y="96">1</text><text x="149" y="96">1</text><text x="209" y="96">1</text><text x="269" y="96">1</text><text x="29" y="156">1</text><text x="89" y="156">1</text><text x="149" y="156">1</text><text x="209" y="156">1</text><text x="269" y="156">1</text><text x="29" y="216">1</text><text x="89" y="216">1</text><text x="149" y="216">1</text><text x="209" y="216">1</text><text x="269" y="216">1</text><text x="29" y="276">1</text><text x="89" y="276">1</text><text x="149" y="276">1</text><text x="209" y="276">1</text><text x="269" y="276">1</text></g>
      </g>
      <text x="232" y="427" text-anchor="middle" font-size="17" font-weight="700" fill="#277F6E">结构覆盖均匀 → 更安全的起点</text>
    </g>
    <rect x="170" y="567" width="780" height="38" rx="14" fill="#FBF2D7" stroke="#B68B2D"/>
    <text x="560" y="592" text-anchor="middle" font-size="16" font-weight="700" fill="#8F6A21">均匀覆盖降低风险，但不能保证训练后绝对不会出现周期纹理</text>
  </g>
</svg>
