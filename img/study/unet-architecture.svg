<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 750" role="img" aria-labelledby="unet-title unet-desc">
  <title id="unet-title">U-Net 编码器、跳跃连接与解码器结构示意图</title>
  <desc id="unet-desc">左侧紫色编码器逐级下采样并增加通道，底部瓶颈层提取全局语义，右侧绿色解码器逐级上采样；四条金色跳跃连接把同尺度的边界细节直接拼接到解码器。</desc>
  <defs>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="165%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#51493F" flood-opacity="0.14"/>
    </filter>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.68" numOctaves="3" seed="13" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="softNoise"><feFuncA type="table" tableValues="0 0.06"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="softNoise" mode="multiply"/>
    </filter>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#756F67" stroke-opacity="0.075"/>
    </pattern>
    <linearGradient id="lavender" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F1EBF8"/><stop offset="1" stop-color="#DCCFEB"/>
    </linearGradient>
    <linearGradient id="sage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF3EF"/><stop offset="1" stop-color="#C8DED4"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF2C7"/><stop offset="1" stop-color="#E8CB78"/>
    </linearGradient>
    <radialGradient id="scan" cx="48%" cy="44%" r="58%">
      <stop offset="0" stop-color="#D9D4CD"/><stop offset="0.55" stop-color="#817C78"/><stop offset="1" stop-color="#3F3D3B"/>
    </radialGradient>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#75629C"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4F826D"/></marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#C49B35"/></marker>
  </defs>

  <rect width="1080" height="750" rx="28" fill="#F6F0E6"/>
  <rect width="1080" height="750" rx="28" fill="url(#grid)"/>
  <path d="M0 668C156 626 268 720 423 681C589 639 725 718 1080 648V750H0Z" fill="#CBDAD5" opacity="0.35"/>
  <path d="M0 706C170 672 301 748 487 708C682 666 831 742 1080 693V750H0Z" fill="#D8CBE6" opacity="0.3"/>

  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="48" y="50" font-size="15" font-weight="700" letter-spacing="2.7" fill="#A17D31">整体结构</text>
    <text x="48" y="87" font-size="31" font-weight="800" fill="#302D2A">U-Net 如何把边界细节送回来？</text>
    <text x="48" y="114" font-size="16" fill="#716B64">左侧压缩语义，右侧恢复分辨率；同尺度特征通过跳跃连接直接拼接</text>
  </g>

  <g filter="url(#shadow)"><rect x="36" y="136" width="1008" height="544" rx="28" fill="#FFFDF9" stroke="#E5DCCD"/></g>
  <path d="M195 210L280 320L365 430L450 540L540 629L630 540L715 430L800 320L885 210" fill="none" stroke="#E9E1D6" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" opacity="0.62"/>

  <!-- skip connections behind the stage cards -->
  <g fill="none" stroke="#C49B35" stroke-width="2.4" stroke-dasharray="8 7" marker-end="url(#arrow-gold)" opacity="0.95">
    <path d="M260 210H820"/>
    <path d="M345 320H735"/>
    <path d="M430 430H650"/>
    <path d="M515 540H565"/>
  </g>
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
    <rect x="438" y="193" width="204" height="34" rx="17" fill="#FFF8DF" stroke="#E4C56D"/>
    <text x="540" y="215" text-anchor="middle" font-size="14" font-weight="700" fill="#80631D">跳跃连接 · 同尺度拼接</text>
  </g>

  <!-- main U-shaped information flow -->
  <g fill="none" stroke-linecap="round" stroke-width="3">
    <path d="M110 210H130" stroke="#75629C" marker-end="url(#arrow-violet)"/>
    <path d="M220 240L255 290" stroke="#75629C" marker-end="url(#arrow-violet)"/>
    <path d="M305 350L340 400" stroke="#75629C" marker-end="url(#arrow-violet)"/>
    <path d="M390 460L425 510" stroke="#75629C" marker-end="url(#arrow-violet)"/>
    <path d="M450 570L500 600" stroke="#75629C" marker-end="url(#arrow-violet)"/>
    <path d="M580 600L630 570" stroke="#4F826D" marker-end="url(#arrow-green)"/>
    <path d="M655 510L690 460" stroke="#4F826D" marker-end="url(#arrow-green)"/>
    <path d="M740 400L775 350" stroke="#4F826D" marker-end="url(#arrow-green)"/>
    <path d="M825 290L860 240" stroke="#4F826D" marker-end="url(#arrow-green)"/>
    <path d="M950 210H970" stroke="#4F826D" marker-end="url(#arrow-green)"/>
  </g>

  <!-- input image -->
  <g filter="url(#shadow)">
    <rect x="45" y="174" width="65" height="72" rx="16" fill="#EEEAE4" stroke="#CFC6B9"/>
    <circle cx="77.5" cy="208" r="24" fill="url(#scan)"/>
    <path d="M68 209C69 198 79 192 88 198C96 204 94 217 85 221C76 225 67 219 68 209Z" fill="#D9D2C8" opacity="0.8"/>
  </g>
  <text x="77.5" y="267" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="700" fill="#5D5751">输入影像</text>

  <!-- output mask -->
  <g filter="url(#shadow)">
    <rect x="970" y="174" width="65" height="72" rx="16" fill="#EAF3EF" stroke="#BFD5CB"/>
    <path d="M984 216C977 201 986 185 1001 185C1016 185 1028 197 1024 211C1021 224 1010 236 995 233C990 232 986 226 984 216Z" fill="#77A994"/>
    <path d="M991 212C988 203 994 194 1002 194C1011 194 1017 201 1015 209C1013 218 1007 224 999 223C995 222 993 218 991 212Z" fill="#F3D77D" opacity="0.9"/>
  </g>
  <text x="1002.5" y="267" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="700" fill="#5D5751">分割结果</text>

  <!-- encoder cards -->
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" filter="url(#paper)">
    <g transform="translate(130 180)"><rect width="130" height="60" rx="16" fill="url(#lavender)" stroke="#A391C4"/><path d="M17 18H35V42H17ZM12 22H30V46H12Z" fill="none" stroke="#75629C" stroke-width="1.7"/><text x="48" y="25" font-size="17" font-weight="800" fill="#554278">编码 1</text><text x="48" y="46" font-size="13" fill="#6E6378">64 通道</text></g>
    <g transform="translate(215 290)"><rect width="130" height="60" rx="16" fill="url(#lavender)" stroke="#A391C4"/><path d="M17 18H35V42H17ZM12 22H30V46H12Z" fill="none" stroke="#75629C" stroke-width="1.7"/><text x="48" y="25" font-size="17" font-weight="800" fill="#554278">编码 2</text><text x="48" y="46" font-size="13" fill="#6E6378">128 通道</text></g>
    <g transform="translate(300 400)"><rect width="130" height="60" rx="16" fill="url(#lavender)" stroke="#A391C4"/><path d="M17 18H35V42H17ZM12 22H30V46H12Z" fill="none" stroke="#75629C" stroke-width="1.7"/><text x="48" y="25" font-size="17" font-weight="800" fill="#554278">编码 3</text><text x="48" y="46" font-size="13" fill="#6E6378">256 通道</text></g>
    <g transform="translate(385 510)"><rect width="130" height="60" rx="16" fill="url(#lavender)" stroke="#A391C4"/><path d="M17 18H35V42H17ZM12 22H30V46H12Z" fill="none" stroke="#75629C" stroke-width="1.7"/><text x="48" y="25" font-size="17" font-weight="800" fill="#554278">编码 4</text><text x="48" y="46" font-size="13" fill="#6E6378">512 通道</text></g>
  </g>

  <!-- decoder cards -->
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" filter="url(#paper)">
    <g transform="translate(565 510)"><rect width="130" height="60" rx="16" fill="url(#sage)" stroke="#88B09F"/><path d="M17 18H35V42H17ZM12 22H30V46H12Z" fill="none" stroke="#4F826D" stroke-width="1.7"/><text x="48" y="25" font-size="17" font-weight="800" fill="#376653">解码 4</text><text x="48" y="46" font-size="13" fill="#587268">512 通道</text></g>
    <g transform="translate(650 400)"><rect width="130" height="60" rx="16" fill="url(#sage)" stroke="#88B09F"/><path d="M17 18H35V42H17ZM12 22H30V46H12Z" fill="none" stroke="#4F826D" stroke-width="1.7"/><text x="48" y="25" font-size="17" font-weight="800" fill="#376653">解码 3</text><text x="48" y="46" font-size="13" fill="#587268">256 通道</text></g>
    <g transform="translate(735 290)"><rect width="130" height="60" rx="16" fill="url(#sage)" stroke="#88B09F"/><path d="M17 18H35V42H17ZM12 22H30V46H12Z" fill="none" stroke="#4F826D" stroke-width="1.7"/><text x="48" y="25" font-size="17" font-weight="800" fill="#376653">解码 2</text><text x="48" y="46" font-size="13" fill="#587268">128 通道</text></g>
    <g transform="translate(820 180)"><rect width="130" height="60" rx="16" fill="url(#sage)" stroke="#88B09F"/><path d="M17 18H35V42H17ZM12 22H30V46H12Z" fill="none" stroke="#4F826D" stroke-width="1.7"/><text x="48" y="25" font-size="17" font-weight="800" fill="#376653">解码 1</text><text x="48" y="46" font-size="13" fill="#587268">64 通道</text></g>
  </g>

  <!-- bottleneck -->
  <g transform="translate(475 600)" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" filter="url(#shadow)">
    <rect width="130" height="58" rx="18" fill="url(#gold)" stroke="#C9A33E"/>
    <text x="65" y="25" text-anchor="middle" font-size="17" font-weight="800" fill="#715615">瓶颈层</text>
    <text x="65" y="45" text-anchor="middle" font-size="12" fill="#806B36">1024 通道</text>
  </g>

  <!-- compact legend -->
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
    <rect x="150" y="708" width="220" height="34" rx="17" fill="#EEE7F6"/><circle cx="171" cy="725" r="5" fill="#75629C"/><text x="184" y="730" font-size="13" fill="#5F5667"><tspan font-weight="700">下采样</tspan><tspan> · 尺寸减半，通道增加</tspan></text>
    <rect x="430" y="708" width="220" height="34" rx="17" fill="#FFF4D5"/><circle cx="451" cy="725" r="5" fill="#C49B35"/><text x="464" y="730" font-size="13" fill="#6E603A"><tspan font-weight="700">跳跃连接</tspan><tspan> · 保留边界细节</tspan></text>
    <rect x="710" y="708" width="220" height="34" rx="17" fill="#E2EFE9"/><circle cx="731" cy="725" r="5" fill="#4F826D"/><text x="744" y="730" font-size="13" fill="#4D665C"><tspan font-weight="700">上采样</tspan><tspan> · 恢复空间分辨率</tspan></text>
  </g>
</svg>
